name: Debian packaging

on:
  push:
    branches:
      - main
    paths: &paths
      - '**'
      - '!.github/**'
      - '.github/workflows/debian.yaml'
      - '!.clang-format'
      - '!.gitignore'
      - '!.golangci.yaml'
      - '!*.md'
      - '!installer/**'
      - '!e2e/**'
    tags:
      - "*"
  pull_request:
    paths: *paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-deb:
    name: Build Debian package
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ubuntu-version: ['noble', 'resolute', 'devel']
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
        with:
          path: adsys

      - name: Build Debian package
        uses: canonical/desktop-engineering/gh-actions/common/build-debian@main
        with:
          source-dir: adsys
          docker-image: ubuntu:${{ matrix.ubuntu-version }}
          # Noble doesn't ship the Go version we require.
          extra-apt-repositories: ${{ (matrix.ubuntu-version == 'noble') && 'ppa:ubuntu-enterprise-desktop/golang' || '' }}

      - name: Run autopkgtests
        uses: canonical/desktop-engineering/gh-actions/common/run-autopkgtest@main
        with:
          lxd-image: ubuntu:${{ matrix.ubuntu-version }}
          source-changes: ${{ env.SOURCE_OUTPUT_DIR }}/${{ env.PKG_SOURCE_CHANGES }}
          debs-dir: ${{ env.BUILD_OUTPUT_DIR }}
          autopkgtest-args: ${{ (matrix.ubuntu-version == 'noble') && '--add-apt-source=ppa:ubuntu-enterprise-desktop/golang' || '' }}
