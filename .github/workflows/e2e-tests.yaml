name: E2E - Run tests

on:
  workflow_dispatch:
    inputs:
      codenames:
        description: 'Comma-separated list of codenames to run tests on (e.g. "noble", "resolute") - will test all supported releases if not specified'
        type: string
        required: false
      repository:
        description: 'Run tests with adsys from a fork (e.g. "username/adsys", defaults to the current repository if not specified)'
        type: string
        required: false
      branch:
        description: 'Run tests with adsys from a branch (defaults to main if not specified)'
        type: string
        required: false

  push:
    branches:
      - main
    tags:
      - "*"

  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}-${{
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name != 'e2e-tests' &&
      github.run_id || 'active'
    }}
  cancel-in-progress: true

jobs:
  supported-releases:
    name: Build matrix for supported ADSys and Ubuntu releases
    permissions:
      contents: read
      pull-requests: read
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        (
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          contains(github.event.pull_request.labels.*.name, 'e2e-tests') &&
          (
            github.event.action != 'labeled' ||
            github.event.label.name == 'e2e-tests'
          )
        )
      }}
    runs-on: ${{ vars.RUNNER }}
    outputs:
      matrix: ${{ steps.set-supported-releases.outputs.matrix }}
    steps:
      - uses: canonical/desktop-engineering/gh-actions/common/dpkg-install-speedup@main
      - name: Install needed binaries
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y distro-info jq
      - uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.branch || github.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build matrix
        id: set-supported-releases
        env:
          CODENAMES_INPUT: ${{ inputs.codenames || '' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_EVENT_BODY: ${{ github.event.pull_request.body || '' }}
        run: |
          set -euo pipefail

          codenames="$(
            {
              distro-info --supported-esm
              distro-info --supported
            } | sort -u
          )"

          requested_codenames="${CODENAMES_INPUT}"
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
              if ! pr_description="$(
                  gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}" --jq '.body // ""'
              )"; then
                  echo "::warning::Could not fetch the current pull request description; falling back to the event body, which may not include later edits."
                  pr_description="${PR_EVENT_BODY}"
              fi
              description_without_comments="$(
                  printf '%s' "${pr_description}" |
                      tr -d '\r' |
                      perl -0pe 's/<!--.*?(?:-->|$)//gs'
              )"
              requested_codenames="$(
                  sed -nE 's/^[[:space:]]*e2e-ubuntu-releases:[[:space:]]*(.*)$/\1/p' \
                      <<< "${description_without_comments}" |
                      paste -sd, -
              )"
          fi

          declare -A requested_releases=()
          requested_count=0
          if [[ -n "${requested_codenames}" ]]; then
              while IFS= read -r requested_codename; do
                  [[ -n "${requested_codename}" ]] || continue
                  if [[ "${requested_codename}" == \"*\" ]]; then
                      requested_codename="${requested_codename:1:${#requested_codename}-2}"
                  fi
                  if [[ ! "${requested_codename}" =~ ^[a-z][a-z0-9-]*$ ]]; then
                      echo "::error::Invalid value in e2e-ubuntu-releases; use supported Ubuntu codenames separated by commas or spaces."
                      exit 1
                  fi

                  if [[ -z "${requested_releases[${requested_codename}]:-}" ]]; then
                      requested_releases["${requested_codename}"]=1
                      requested_count=$((requested_count + 1))
                  fi
              done < <(printf '%s\n' "${requested_codenames}" | tr -s ' ,\t' '\n')

              if (( requested_count == 0 )); then
                  echo "::error::e2e-ubuntu-releases must list at least one Ubuntu codename."
                  exit 1
              fi
          fi

          releases=()
          release_count=0
          declare -A available_releases=()
          while IFS= read -r codename; do
              # Filter out unsupported LTS releases. Keep this list in sync
              # with the one in e2e-build-images.yaml: testing a release we
              # never build a template for can only ever fail.
              if [[ "${codename}" =~ ^(xenial|bionic|focal|jammy)$ ]]; then
                  continue
              fi

              if (( requested_count > 0 )) && [[ -z "${requested_releases[${codename}]:-}" ]]; then
                  continue
              fi

              # Filter out releases with no VM template in our image gallery,
              # as there is nothing to provision the client VM from.
              # Assign first so that a failing lookup fails the job instead of
              # being silently treated as a missing template.
              templateVersion="$(go run ./e2e/cmd/build_base_image/00_check_vm_image --codename "${codename}" --check-template)"
              if [ -z "${templateVersion}" ]; then
                  continue
              fi

              releases+=("${codename}")
              available_releases["${codename}"]=1
              release_count=$((release_count + 1))
          done <<< "${codenames}"

          if (( requested_count > 0 )); then
              for requested_codename in "${!requested_releases[@]}"; do
                  if [[ -z "${available_releases[${requested_codename}]:-}" ]]; then
                      echo "::error::Requested Ubuntu release '${requested_codename}' is unsupported or has no VM template available."
                      exit 1
                  fi
              done
          fi

          if (( release_count == 0 )); then
              echo "::error::No supported release has a VM template available, check the \"E2E - Build image templates\" workflow"
              exit 1
          fi

          matrix="$(printf '%s\n' "${releases[@]}" | jq -R . | jq -cs .)"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"

  tests:
    name: Tests
    runs-on: ${{ vars.RUNNER }}
    needs:
      - supported-releases
    strategy:
      matrix:
        codename: ${{ fromJSON(needs.supported-releases.outputs.matrix) }}
      fail-fast: false
    env:
      AD_PASSWORD: ${{ secrets.AD_PASSWORD }}
      ADSYS_PRO_TOKEN: ${{ secrets.ADSYS_PRO_TOKEN }}
    steps:
      - uses: canonical/desktop-engineering/gh-actions/common/dpkg-install-speedup@main
      - name: Install required dependencies
        run: |
          sudo apt-get update
          # Required for the XML to POL conversion
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y python3-samba
      - uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.branch || github.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AZURE_SSH_KEY }}" > ~/.ssh/adsys-e2e.pem
          chmod 600 ~/.ssh/adsys-e2e.pem
      - name: Build adsys deb
        run: go run ./e2e/cmd/run_tests/00_build_adsys_deb --codename ${{ matrix.codename }}
      - name: Set up VPN connection
        uses: ./.github/actions/azure-sstpc-vpn
        with:
          gateway: ${{ secrets.VPN_GATEWAY }}
          ca: ${{ secrets.VPN_CA }}
          cert: ${{ secrets.VPN_CERT }}
          key: ${{ secrets.VPN_KEY }}
      - name: Provision client VM
        run: go run ./e2e/cmd/run_tests/01_provision_client
      - name: Provision AD server
        run: go run ./e2e/cmd/run_tests/02_provision_ad
      - name: Recompile PAM module with coverage support
        run: go run ./e2e/cmd/run_tests/03_pam_coverage_support
        if: ${{ matrix.codename == 'noble' }}
      - name: 'Test: non-Pro managers'
        run: go run ./e2e/cmd/run_tests/10_test_non_pro_managers
      - name: 'Test: Pro managers'
        run: go run ./e2e/cmd/run_tests/11_test_pro_managers
      - name: 'Test: PAM and Kerberos ticket cache'
        run: go run ./e2e/cmd/run_tests/12_test_pam_krb5cc
      - name: Collect PAM module coverage
        run: go run ./e2e/cmd/run_tests/98_collect_pam_coverage
        if: ${{ matrix.codename == 'noble' }}
      - name: Upload PAM coverage as artifact
        uses: actions/upload-artifact@v7
        with:
          name: pam-coverage.zip
          path: ./output/pam-cobertura.xml
        if: ${{ matrix.codename == 'noble' }}
      - name: Collect logs on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs-${{ matrix.codename }}
          path: logs/
      - name: Collect VPN diagnostics on failure
        if: ${{ failure() }}
        run: |
          echo "=== ppp0 ==="
          ip -4 addr show ppp0 || echo "ppp0 is gone"
          echo "=== routing rules ==="
          ip rule show || true
          echo "=== VPN routing table ==="
          ip route show table 42 || true
          echo "=== pppd and sstpc log ==="
          sudo journalctl -b 0 -t pppd -t sstpc --no-pager -n 100 || true
      - name: Deprovision resources
        if: ${{ always() }}
        run: go run ./e2e/cmd/run_tests/99_deprovision
