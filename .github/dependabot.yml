# See the documentation for all configuration options:
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
    groups:
      minor-updates:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps(go)"
    ignore:
      # Keep the latest LTS buildable with its archive's Go 1.26.
      # TODO: Drop this ignore list once Resolute's archive provides Go 1.27.
      - dependency-name: "github.com/leonelquinteros/gotext"
        versions: [">=1.8.0"]

  - package-ecosystem: "gomod"
    directory: "/tools"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
    groups:
      minor-updates:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps(go-tools)"

  - package-ecosystem: "github-actions"
    # Workflow files stored in the
    # default location of `.github/workflows`
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
    groups:
      gh-actions:
        patterns: ["*"]
    commit-message:
      prefix: "deps(ci)"
